<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script defer type="module" src="assets/js/main.js"></script>
    <title>Dylaris's Blog</title>
  </head>
  <body>
    <div class="container">
      <header class="container-header">
        <div class="header-wrapper">
          <nav>
            <ul>
              <li><a href="#" id="nav-home">Home</a></li>
              <li><a href="#" id="nav-about">About</a></li>
              <li><a href="#" id="nav-postlist">PostList</a></li>
              <li><a href="#" id="nav-todolist">TodoList</a></li>
            </ul>
          </nav>
          <!-- Theme toggle button -->
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
          </button>
        </div>
      </header>

      <main class="container-main">
        <p>Loading...</p>
      </main>

      <footer class="container-footer">
        <p>
          <a href="https://github.com/dylaris" target="_blank" rel="noopener noreferrer">GitHub</a> |
          <a href="mailto:3445818679@qq.com">Email</a>
        </p>
      </footer>
    </div>

    <script type="module">
      import { navigateToPage } from './assets/js/core/router.js';

      // ===== Page navigate =====
      document.getElementById('nav-home').addEventListener('click', (e) => {
        e.preventDefault();
        navigateToPage('home');
      });

      document.getElementById('nav-about').addEventListener('click', (e) => {
        e.preventDefault();
        navigateToPage('about');
      });

      document.getElementById('nav-postlist').addEventListener('click', (e) => {
        e.preventDefault();
        navigateToPage('postlist');
      });

      document.getElementById('nav-todolist').addEventListener('click', (e) => {
        e.preventDefault();
        navigateToPage('todolist');
      });

      // ===== Theme toggle =====
      const toggleBtn = document.getElementById('themeToggle');
      const thumb = toggleBtn.querySelector('.toggle-thumb');

      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = storedTheme === 'dark' || (!storedTheme && prefersDark);

      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        thumb.classList.add('dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      toggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'light');
          thumb.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          thumb.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    </script>
  </body>
</html>
